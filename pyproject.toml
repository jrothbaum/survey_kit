[project]
name = "survey-kit"
version = "0.2.0"
description = "Tools for working with survey and other data"
readme = "README.md"
requires-python = ">=3.9"

license = {text = "CC0 1.0 Universal"}
authors = [
    {name = "Jon Rothbaum", email = "jon.rothbaum@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "dill>=0.4.0",
    "psutil",
    "igraph",
    "survey-kit-formula>=0.1.0",
    "narwhals>=2.7.0",
    "numexpr>=2.10.2",
    "polars>=1.25.2",
    "pyarrow>=19.0.0",
    "cffi",
    "pypardiso>=0.4.6; platform_machine == 'x86_64'",
    "scipy>=1.13.1",
    "sparse-dot-mkl>=0.9.9; platform_machine == 'x86_64'",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "numba",
    "numpy>=2.0.2",
]

#   Optional extras for the regression/estimation adapters in
#   survey_kit.statistics.adapters - none of these are hard dependencies,
#   install only the one(s) you actually use, e.g. `pip install
#   survey-kit[statsmodels]` or `uv add survey-kit --extra statsmodels`.
[project.optional-dependencies]
statsmodels = ["statsmodels>=0.14.6"]
linearmodels = ["linearmodels>=6.1"]
polars-ds = ["polars_ds"]
pyfixest = ["pyfixest>=0.40.1"]
#   R-based adapters (fixest, lm/glm) - also requires R itself and, for now,
#   the R "arrow" package to be installed separately (not something pip/uv
#   can do) - see survey_kit.statistics._r_interop.check_r_setup(). Prefer
#   the pyfixest extra above for fixed-effects regression if it covers what
#   you need - it mirrors fixest's own syntax with no R dependency at all.
r = ["rpy2>=3.6.7", "rpy2-arrow>=0.1.3"]
#   Stata-based adapter - also requires a licensed Stata 17+ install for its
#   bundled `pystata` package, which isn't on PyPI (see
#   survey_kit.statistics._stata_interop.check_stata_setup()). Untested
#   against a real Stata instance as of this writing - see that module's
#   docstring before relying on it.
stata = ["polars_readstat>=0.21.1"]
all-stats = ["survey-kit[statsmodels,linearmodels,polars-ds,pyfixest,r,stata]"]

[dependency-groups]
dev = [
    "duckdb>=1.4.1",
    "pandas",
    "ruff>=0.14.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "jupyter>=1.1.1",
    "jupytext>=1.18.1",
    "survey-kit-data",
    "xgboost>=2.1.4",
    "catboost>=1.2.10",
    "plotly>=6.0.0",
    "survey-kit[all-stats]",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
target-version = "py39"

[tool.uv.sources]
survey-kit-data = { git = "https://github.com/jrothbaum/survey_kit_data" }
# survey-kit-formula = { path = "../survey_kit_formula", editable = true }