[project]
name = "survey-kit"
version = "0.1.2"
description = "Tools for working with survey and other data"
readme = "README.md"
requires-python = ">=3.13"

license = {text = "CC0 1.0 Universal"}
authors = [
    {name = "Jon Rothbaum", email = "jon.rothbaum@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "dill>=0.4.0",
    "psutil",
    "igraph",
    "survey-kit-formula",
    "numexpr>=2.10.2",
    "polars>=1.25.2",
    "pyarrow>=19.0.0",
    "cffi",
    "pypardiso>=0.4.6",
    "scipy>=1.13.1",
    "sparse-dot-mkl>=0.9.9",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "numba",
]


[dependency-groups]
dev = [
    "numpy>=2.0.2",
    "ruff>=0.14.0",
    "polars_ds",
    "mkdocs-material",
    "mkdocstrings[python]",
    "jupyter>=1.1.1",
    "jupytext>=1.18.1",
    "survey-kit-data",
    "pytest>=9.1.1",
    "ty>=0.0.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
target-version = "py313"

[tool.uv.sources]
survey-kit-data = { git = "https://github.com/jrothbaum/survey_kit_data" }
survey-kit-formula = { path = "../survey_kit_formula", editable = true }
